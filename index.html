<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>阿潛工作台</title>
<style>
:root{color-scheme:dark}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
background:#0c1116;color:#e6edf3;font-family:-apple-system,"Noto Sans TC",sans-serif}
.box{text-align:center;padding:28px 22px;max-width:420px}
h1{font-size:20px;font-weight:600;margin:0 0 6px}
.sub{font-size:13px;color:#8b949e;margin:0 0 24px;line-height:1.6}
a.go{display:block;padding:16px;border-radius:12px;background:#1f6feb;color:#fff;
text-decoration:none;font-size:16px;font-weight:600}
a.go:active{background:#1a5fd0}
.state{margin-top:18px;font-size:12px;color:#6e7681;word-break:break-all}
</style>
</head>
<body>
<div class="box">
  <h1>阿潛工作台</h1>
  <p class="sub" id="sub">搵緊現時條隧道…</p>
  <a class="go" id="go" href="#" style="display:none">進入</a>
  <div class="state" id="state"></div>
</div>
<script>
(async () => {
  const sub = document.getElementById('sub');
  const go = document.getElementById('go');
  const state = document.getElementById('state');
  try {
    const r = await fetch('url.txt?t=' + Date.now(), {cache:'no-store'});
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const raw = (await r.text()).trim().split('\n')[0].trim();
    if (!/^https?:\/\//i.test(raw)) throw new Error('未設定');
    go.href = raw;
    go.style.display = 'block';
    sub.textContent = '現時可用：';
    state.textContent = raw;
    setTimeout(() => location.replace(raw), 900);
  } catch (e) {
    sub.textContent = '未有可用網址（隧道未啟動）';
    state.textContent = String(e.message || e);
  }
})();
</script>
</body>
</html>
